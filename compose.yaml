services:
  website:
    build:
      context: .
      args:
        SITE_ORIGIN: ${SITE_ORIGIN:-}
    image: utep-ras:local
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
